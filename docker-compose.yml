services:
  db:
    ports:
      - 5432:5432
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_PASSWORD: "kapita"
      POSTGRES_USER: "kapita"
      POSTGRES_DB: "kapita"
    volumes:
      - kapita-db-data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: always

volumes:
  kapita-db-data:
    name: kapita-db-data
